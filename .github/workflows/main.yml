name: CI/CD to Hugging Face

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx huggingface_hub

      - name: Run Unit Tests
        run: |
          export PYTHONPATH=$PYTHONPATH:.
          pytest tests/

      - name: Push to Hugging Face (Using CLI for Large Files)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && success()
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # ใช้ huggingface-cli upload แทน git push เพื่อรองรับไฟล์ใหญ่โดยไม่ต้องตั้งค่า LFS เอง
          huggingface-cli upload PhonePixelGhost/Image_Classification_Service . . --repo-type space --token $HF_TOKEN --exclude ".git/*" ".github/*"
